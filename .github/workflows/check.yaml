name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type check, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: The committed bundle matches the source
        run: git diff --exit-code dist
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the screenshots of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test/e2e/test-results
          retention-days: 7
