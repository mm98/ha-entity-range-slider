name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: The committed bundle matches the source
        run: git diff --exit-code dist
